<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Confirmações — Chá de Bebê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lavender-mist:#F6EEFB;
    --cream:#FFFAF4;
    --aubergine:#2E1A3D;
    --orchid:#A855C2;
    --orchid-deep:#7C3AA0;
    --violet-blue:#7B5EA7;
    --line:#E3D3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--lavender-mist); color:var(--aubergine);
    font-family:'Quicksand',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  h1{font-family:'Cormorant Garamond',serif; color:var(--orchid-deep); font-size:28px; margin:0 0 6px;}
  .wrap{width:100%; max-width:480px;}
  .card{
    background:var(--cream); border:1px solid var(--line); border-radius:24px; padding:32px;
    box-shadow:0 20px 60px -20px rgba(124,58,160,.3);
  }
  .card p.sub{color:var(--violet-blue); font-size:14px; margin:0 0 20px;}
  input{
    width:100%; font-family:'Quicksand',sans-serif; border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:15px; background:#fff; color:var(--aubergine); margin-bottom:12px;
  }
  button{
    width:100%; background:var(--orchid-deep); color:#fff; border:none; border-radius:999px;
    padding:12px 28px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Quicksand',sans-serif;
  }
  button:hover{background:var(--orchid);}
  button:disabled{opacity:.6; cursor:default;}
  .error{color:#b23b5a; font-size:13px; margin-top:10px;}
  .hidden{display:none;}
  .summary{display:flex; gap:16px; margin-bottom:20px;}
  .summary .stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center;}
  .summary .stat .num{font-family:'Cormorant Garamond',serif; font-size:32px; color:var(--orchid); font-weight:600;}
  .summary .stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--violet-blue); margin-top:4px;}
  .list{display:flex; flex-direction:column; gap:10px; max-height:55vh; overflow-y:auto;}
  .item{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center; font-size:14px; gap:10px;
  }
  .item .name{font-weight:700; color:var(--orchid-deep);}
  .item .guests{font-size:12px; color:var(--violet-blue); white-space:nowrap;}
  .empty{text-align:center; color:var(--violet-blue); font-size:14px; padding:30px 0;}
  .logout{background:none; border:1px solid var(--line); color:var(--violet-blue); margin-top:18px;}
  .logout:hover{background:var(--lavender-mist); color:var(--orchid-deep);}
</style>
</head>
<body>

<div class="wrap">
  <div class="card" id="loginCard">
    <h1>Confirmações 🦋</h1>
    <p class="sub">Área restrita — chá de bebê da Isabela.</p>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div class="error" id="loginError"></div>
  </div>

  <div class="card hidden" id="dataCard">
    <h1>Confirmações 🦋</h1>
    <p class="sub">Atualiza em tempo real conforme as pessoas confirmam.</p>
    <div class="summary">
      <div class="stat"><div class="num" id="totalConfirmados">0</div><div class="label">Confirmações</div></div>
      <div class="stat"><div class="num" id="totalPessoas">0</div><div class="label">Total de pessoas</div></div>
    </div>
    <div class="list" id="list"><div class="empty">Carregando...</div></div>
    <button class="logout" id="logoutBtn">Sair</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAi9sA369k4VtUSRdupVLws4-9qLFy8wc0",
  authDomain: "isabela-enxoval.firebaseapp.com",
  projectId: "isabela-enxoval",
  storageBucket: "isabela-enxoval.firebasestorage.app",
  messagingSenderId: "801065887048",
  appId: "1:801065887048:web:443d5ebf07ce392f44ff7d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginCard = document.getElementById('loginCard');
const dataCard = document.getElementById('dataCard');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');
const list = document.getElementById('list');
const totalConfirmados = document.getElementById('totalConfirmados');
const totalPessoas = document.getElementById('totalPessoas');

let unsubscribe = null;

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loginBtn.addEventListener('click', async ()=>{
  loginError.textContent = '';
  loginBtn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
  }catch(e){
    loginError.textContent = 'E-mail ou senha incorretos.';
  }
  loginBtn.disabled = false;
});

loginPassword.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') loginBtn.click(); });

logoutBtn.addEventListener('click', ()=> signOut(auth));

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginCard.classList.add('hidden');
    dataCard.classList.remove('hidden');
    if(!unsubscribe){
      const q = query(collection(db, 'confirmacoes'), orderBy('ts', 'desc'));
      unsubscribe = onSnapshot(q, (snapshot)=>{
        const docs = snapshot.docs.map(d => d.data());
        totalConfirmados.textContent = docs.length;
        totalPessoas.textContent = docs.reduce((sum, d) => sum + 1 + (d.acompanhantes||0), 0);
        if(docs.length === 0){
          list.innerHTML = '<div class="empty">Nenhuma confirmação ainda.</div>';
          return;
        }
        list.innerHTML = docs.map(d => `
          <div class="item">
            <span class="name">${escapeHtml(d.nome)}</span>
            <span class="guests">${d.acompanhantes > 0 ? '+' + d.acompanhantes + ' acompanhante' + (d.acompanhantes>1?'s':'') : 'sozinha(o)'}</span>
          </div>
        `).join('');
      });
    }
  } else {
    dataCard.classList.add('hidden');
    loginCard.classList.remove('hidden');
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  }
});
</script>
</body>
</html>
